name: test

on:
  push:
    branches: [ master, gtk3-port ]
  pull_request:
    branches: [ master, gtk3-port ]

jobs:
  prove:
    name: prove (ubuntu-22.04 / openssl 3.x)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            perl \
            libgtk3-perl libglib-perl libpango-perl libcairo-perl \
            libmime-base64-perl liblocale-gettext-perl \
            libtest-deep-perl libtest-exception-perl \
            openssl zip tar

      - name: Show Perl + OpenSSL versions
        run: |
          perl -v | head -3
          openssl version

      - name: Run the test suite
        run: prove -lr t/
